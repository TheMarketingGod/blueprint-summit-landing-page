services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: blueprint_summit
      MARIADB_USER: blueprint_summit
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: blueprint_summit
      WORDPRESS_DB_USER: blueprint_summit
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('WP_HOME', 'https://summit.therayreynoldsuniversity.com');
        define('WP_SITEURL', 'https://summit.therayreynoldsuniversity.com');
        define('FORCE_SSL_ADMIN', true);
        define('DISALLOW_FILE_EDIT', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/themes/blueprint-summit:/var/www/html/wp-content/themes/blueprint-summit
      - ./scripts:/var/www/scripts:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "80:80"
    volumes:
      - ./nginx/gcp.conf:/etc/nginx/conf.d/default.conf:ro

  wp-cli:
    image: wordpress:cli-php8.3
    depends_on:
      - db
      - wordpress
    profiles:
      - tools
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: blueprint_summit
      WORDPRESS_DB_USER: blueprint_summit
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/themes/blueprint-summit:/var/www/html/wp-content/themes/blueprint-summit
      - ./scripts:/var/www/scripts:ro

volumes:
  db_data:
  wp_data:
